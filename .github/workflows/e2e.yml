name: e2e

# 配布版 (R8 適用後) の APK をエミュレータに入れ、ランナー上のサーバーにつないで外から操作して確かめる (#12)。
# 実行するタイミングは D-018 を参照。
on:
  # 文書だけの変更では走らせない (アプリに影響しないため。D-024)
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "releases/notes/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "releases/notes/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Android 15 (API 35) と、targetSdk と同じ Android 17 (API 37。ローカルネットワーク権限などの動作変更がある。#42)
    strategy:
      fail-fast: false
      matrix:
        api: ["35", "37.0"]
    name: e2e (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # 依存ライブラリと Gradle の取得を前回の実行から使い回し、待ち時間を減らす (#31)
          cache: gradle
      - name: Install SDK packages
        run: .github/scripts/sdk-install.sh
      # 上書き更新の確認 (D-075 の 3、D-080): 前の版 = 最新のリリースのタグ。その APK をタグごとにキャッシュし、無ければこのジョブで作る。
      # 署名は e2e-run.sh が 2 つの APK を同じ使い捨ての鍵で署名し直してそろえる
      - name: Pick the previous release
        id: prev
        run: |
          tag=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "前の版: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Restore previous release APK
        id: prev-cache
        uses: actions/cache/restore@v5
        with:
          path: prev-apk/
          key: e2e-prev-${{ steps.prev.outputs.tag }}-v2
      # 作れなくても止めない (ほかの確認は動かす)。e2e-run.sh が、前の版の APK が無いことを失敗にする
      - name: Build previous release APK
        if: steps.prev-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: .github/scripts/e2e-build-prev.sh "${{ steps.prev.outputs.tag }}"
      # e2e が失敗しても残す (actions/cache の後片付けは、ジョブが通ったときしか保存しない)
      - name: Save previous release APK
        if: steps.prev-cache.outputs.cache-hit != 'true' && hashFiles('prev-apk/app-release.apk') != ''
        uses: actions/cache/save@v5
        with:
          path: prev-apk/
          key: e2e-prev-${{ steps.prev.outputs.tag }}-v2
      # 配布版は debug 鍵で署名する (R8 の処理は本物の配布版と同じ。鍵は Secrets を使わない)
      - name: Build release APK and e2e APK
        run: ./gradlew :app:assembleRelease :e2e:assembleDebug
      - uses: ./.github/actions/local-server
      - name: Start emulator
        timeout-minutes: 15
        env:
          API: ${{ matrix.api }}
        run: .github/scripts/emulator-start.sh
      - name: Run e2e
        timeout-minutes: 20
        env:
          PREV_APK: prev-apk/app-release.apk
        run: .github/scripts/e2e-run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-api${{ matrix.api }}
          path: |
            e2e-out/
            app/build/outputs/mapping/release/mapping.txt
      - name: Logs
        if: failure()
        run: tail -n 60 ~/backend.log ~/web.log ~/emulator.log || true
